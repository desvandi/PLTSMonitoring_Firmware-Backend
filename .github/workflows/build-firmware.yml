name: build-firmware

# ============================================================================
# CI Release Engineering (P0-2, P0-4, P0-5 — Audit 2026-09 + Audit 8)
#   - Production env build is now REQUIRED (env:production) with secrets via
#     GitHub Environment "production" (P0-2). Pre-build assert hook
#     scripts/assert_production_secrets.py enforces the fail-closed contract.
#   - Binary auto-commit to main REMOVED (P0-4). Binaries are uploaded as
#     GitHub Actions artifacts (immutable) and, on tag, attached to a GitHub
#     Release. Source repo stays source-only.
#   - release.json + provenance.json + SHA256SUMS generated for every build
#     (P0-5). Cross-repo consumers (PWA, GAS) MUST reference these manifests.
#   - --skip-build in scripts/release_firmware_generic.py is hard-rejected in
#     CI (P0-3) — every release artifact comes from a clean checkout.
#
# [AUDIT 8 P0-C/P0-D] Immutable release pipeline:
#   On tag push (v*), after build+test+gate PASS:
#     1. Sign the production firmware binary with Ed25519
#     2. Re-run release_gate.py with --strict + --ci-sha + --public-key +
#        --pwa-path + --firmware-repo-path (ALL invariants mandatory)
#     3. Require hardware acceptance evidence file
#        (docs/hardware-acceptance/v<X.Y.Z>.md) to exist in the tag commit
#     4. Create a GitHub Release with all artifacts attached (immutable)
#     5. The release IS the canonical distribution authority — PWA/GAS/device
#        pull from this release URL, never from a stale repo copy.
#   Gate FAIL => NO RELEASE, NO TAG, NO OTA PUBLISH.
# ============================================================================

on:
  # [Audit 8] Tag push triggers the immutable release pipeline.
  # Branch push uses paths filtering; tag push triggers unconditionally.
  push:
    branches:
      - main
    paths:
      - 'firmware/**'
      - 'firmware-generic/**'
      - 'scripts/**'
      - '.github/workflows/build-firmware.yml'
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Manual build reason"
        required: false
        default: "manual"

permissions:
  contents: read        # default; release-publish job escalates to write

jobs:
  test:
    name: Python unit + property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install cryptography (for Ed25519 interop test)
        run: python -m pip install --upgrade pip cryptography
      - name: Run firmware logic tests
        run: |
          fail=0
          for t in scripts/test_*.py; do
            echo "=== $t ==="
            python "$t" || fail=1
          done
          exit $fail

  # --------------------------------------------------------------------------
  # P0-2: Production build is mandatory. Pre-build assert hook will fail the
  # build if any required secret is missing or invalid. Secrets come from the
  # GitHub Environment "production" (protected: required reviewers + branch
  # lock). The job is gated so PRs from forks cannot access secrets.
  #
  # [audit-2 S-6 FIX] Only run on push-to-main or manual dispatch. PR builds
  # cannot access the protected `production` environment — running this job
  # on PRs would fail with "Environment not found" once branch protection
  # is applied (per docs/P2_BRANCH_PROTECTION_AND_GPG_SIGNING.md).
  # --------------------------------------------------------------------------
  build-production:
    name: PlatformIO build — env:production (modular)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: production
      url:  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    env:
      PIO_CORE: "6.1.18"          # P1-7 pinned PlatformIO core (espressif32 platform version is pinned in firmware/platformio.ini)
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO (deterministic — keyed on platformio.ini hash)
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-prod-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}-v1
          # P2-3: no broad restore-keys — broad keys can restore stale packages
          #       and break reproducibility.

      - name: Install PlatformIO (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install "platformio==${PIO_CORE}"

      - name: Compile production env (modular)
        working-directory: firmware
        env:
          MQTT_BROKER_HOST:           ${{ secrets.PIO_MQTT_BROKER_HOST }}
          MQTT_BROKER_PORT:           ${{ secrets.PIO_MQTT_BROKER_PORT }}
          MQTT_USERNAME:              ${{ secrets.PIO_MQTT_USERNAME }}
          MQTT_PASSWORD:              ${{ secrets.PIO_MQTT_PASSWORD }}
          MQTT_ROOT_CA:               ${{ secrets.PIO_MQTT_ROOT_CA }}
          OTA_ED25519_PUBLIC_KEY_HEX: ${{ secrets.PIO_OTA_ED25519_PUBLIC_KEY_HEX }}
          OTA_HTTPS_ROOT_CA:          ${{ secrets.PIO_OTA_HTTPS_ROOT_CA }}
        run: |
          pio run -e production
        # assert_production_secrets.py (extra_scripts=pre:...) reads BUILD_FLAGS
        # and refuses to compile if any secret is missing/placeholder/wildcard.

      - name: Stage modular artifacts
        working-directory: firmware
        run: |
          mkdir -p artifacts
          cp .pio/build/production/bootloader.bin artifacts/bootloader.bin
          cp .pio/build/production/partitions.bin artifacts/partitions.bin
          cp .pio/build/production/firmware.bin   artifacts/firmware.bin

      - name: Generate provenance
        run: |
          FIRMWARE_VERSION=$(grep -oE 'FIRMWARE_VERSION\s*=\s*"[0-9.]+"' firmware/firmware_v1.ino \
                            | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          python3 scripts/generate_provenance.py \
            --target modular \
            --version "${FIRMWARE_VERSION}" \
            --bin-dir firmware/artifacts \
            --firmware-name firmware.bin \
            --out-dir firmware/artifacts

      # [Audit 8 P0-A] Sign the production firmware binary with Ed25519.
      # The signing key comes from the production environment secret
      # PIO_FIRMWARE_SIGNING_PRIVATE_KEY (PEM). The public key is also
      # uploaded as an artifact so release_gate.py can verify without
      # needing the private key.
      - name: Sign production firmware (Ed25519)
        working-directory: firmware/artifacts
        env:
          PIO_FIRMWARE_SIGNING_PRIVATE_KEY: ${{ secrets.PIO_FIRMWARE_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$PIO_FIRMWARE_SIGNING_PRIVATE_KEY" ]; then
            echo "ERROR: PIO_FIRMWARE_SIGNING_PRIVATE_KEY secret not set in production environment"
            echo "Production firmware CANNOT be released unsigned (Audit 8 P0-A)"
            exit 1
          fi
          echo "$PIO_FIRMWARE_SIGNING_PRIVATE_KEY" > /tmp/firmware_signing_private.pem
          chmod 600 /tmp/firmware_signing_private.pem
          python3 ../../scripts/sign_firmware.py --sign firmware.bin
          # sign_firmware.py writes firmware.bin.sig + firmware.bin.sha256 + firmware.bin.ota.json
          # Clean up the private key from disk immediately
          shred -u /tmp/firmware_signing_private.pem
          ls -la

      - name: Generate canonical OTA manifest (schema 2.0)
        run: |
          python3 scripts/generate_canonical_manifest.py \
            --release-json firmware/artifacts/release.json \
            --provenance-json firmware/artifacts/provenance.json \
            --bin-dir firmware/artifacts \
            --out firmware/artifacts/manifest-canonical.json

      - name: Upload artifact (immutable — no commit to source repo)
        uses: actions/upload-artifact@v4
        with:
          name: plts-firmware-modular-production
          path: |
            firmware/artifacts/*.bin
            firmware/artifacts/*.bin.sig
            firmware/artifacts/*.bin.sha256
            firmware/artifacts/*.bin.ota.json
            firmware/artifacts/release.json
            firmware/artifacts/provenance.json
            firmware/artifacts/SHA256SUMS
            firmware/artifacts/manifest-canonical.json
          if-no-files-found: error

  build-staging:
    name: PlatformIO build — env:staging + env:development (modular)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    env:
      PIO_CORE: "6.1.18"   # [P1-7 Audit 8] pinned — was `pip install -U platformio`
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO (deterministic)
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-staging-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}-v1

      - name: Install PlatformIO (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install "platformio==${PIO_CORE}"

      - name: Compile development env
        working-directory: firmware
        run: pio run -e development

      - name: Compile staging env
        working-directory: firmware
        run: pio run -e staging

      - name: Upload modular dev+staging artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plts-firmware-modular-dev-staging
          path: |
            firmware/.pio/build/*/firmware.bin
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Legacy generic tree. NO auto-commit (P0-4). Build artifacts only.
  # [P1-7 Audit 8] PIO_CORE pinned — was `pip install -U platformio`.
  # --------------------------------------------------------------------------
  build-generic-tree:
    name: PlatformIO build — firmware-generic/ (legacy)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    env:
      PIO_CORE: "6.1.18"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO (deterministic)
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-generic-${{ runner.os }}-${{ hashFiles('firmware-generic/platformio.ini') }}-v1

      - name: Install PlatformIO (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install "platformio==${PIO_CORE}"

      - name: Compile firmware-generic
        working-directory: firmware-generic
        run: pio run -e esp32dev

      - name: Stage binaries + manifest into /bin
        working-directory: firmware-generic
        run: |
          mkdir -p bin
          cp .pio/build/esp32dev/bootloader.bin bin/bootloader.bin
          cp .pio/build/esp32dev/partitions.bin bin/partitions.bin
          cp .pio/build/esp32dev/firmware.bin   "bin/plts_firmware_v$(python -c "import json;print(json.load(open('manifest.json'))['version'])").bin"
          ls -la bin/

      - name: Generate provenance
        run: |
          VERSION=$(python -c "import json;print(json.load(open('firmware-generic/manifest.json'))['version'])")
          python3 scripts/generate_provenance.py \
            --target generic \
            --version "${VERSION}" \
            --bin-dir firmware-generic/bin \
            --out-dir firmware-generic/bin
          # [Audit 8 P1-2] Generate canonical OTA manifest (schema 2.0) with
          # SHA-256 + signature. This is the OTA authority; legacy manifest.json
          # is preserved for ESP Web Tools browser flashing only.
          python3 scripts/generate_canonical_manifest.py \
            --release-json firmware-generic/bin/release.json \
            --provenance-json firmware-generic/bin/provenance.json \
            --bin-dir firmware-generic/bin \
            --out firmware-generic/bin/manifest-canonical.json

      - name: Upload artifact (immutable — no commit to source repo, P0-4)
        uses: actions/upload-artifact@v4
        with:
          name: plts-firmware-generic
          path: |
            firmware-generic/bin/*.bin
            firmware-generic/bin/release.json
            firmware-generic/bin/provenance.json
            firmware-generic/bin/SHA256SUMS
            firmware-generic/bin/manifest-canonical.json
            firmware-generic/manifest.json
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # P1-9 / Audit 8 P0-A/P0-B/P1-5: Master release gate.
  # Runs after all builds. Verifies that every required invariant passes.
  # On tag push: applies --strict (production invariants) + --ci-sha binding.
  # On branch push / PR: relaxed (dev/staging invariants).
  # --------------------------------------------------------------------------
  release-gate:
    name: Master release gate
    runs-on: ubuntu-latest
    needs: [build-production, build-staging, build-generic-tree]
    if: always()   # run even if a build skipped (e.g., build-production on PR)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history for git describe in provenance

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cryptography (for Ed25519 signature verification)
        run: python -m pip install --upgrade pip cryptography

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ci-artifacts

      - name: Checkout PWA repo (for cross-repo check on production releases)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/checkout@v4
        with:
          repository: desvandi/PLTSMonitoring_PWA
          path: pwa-checkout
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}

      - name: Export Ed25519 public key for gate verification
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PIO_OTA_ED25519_PUBLIC_KEY_HEX: ${{ secrets.PIO_OTA_ED25519_PUBLIC_KEY_HEX }}
        run: |
          # The firmware embeds the public key as a hex string. Export it as
          # a PEM file so release_gate.py can load it via cryptography lib.
          if [ -z "$PIO_OTA_ED25519_PUBLIC_KEY_HEX" ]; then
            echo "ERROR: PIO_OTA_ED25519_PUBLIC_KEY_HEX not available for tag build"
            exit 1
          fi
          python3 -c "
          import sys
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey
          from cryptography.hazmat.primitives import serialization
          hex_key = '$PIO_OTA_ED25519_PUBLIC_KEY_HEX'
          if len(hex_key) != 64:
              print('ERROR: public key must be 64 hex chars', file=sys.stderr)
              sys.exit(1)
          pub = Ed25519PublicKey.from_public_bytes(bytes.fromhex(hex_key))
          pem = pub.public_bytes(
              encoding=serialization.Encoding.PEM,
              format=serialization.PublicFormat.SubjectPublicKeyInfo,
          )
          open('/tmp/firmware_signing_public.pem', 'wb').write(pem)
          print('Public key exported to /tmp/firmware_signing_public.pem')
          "

      - name: Run release gate (relaxed — branch/PR)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          python3 scripts/release_gate.py \
            --artifacts-dir ci-artifacts \
            --target generic \
            --target modular \
            --ci-sha "$GITHUB_SHA"

      - name: Run release gate (STRICT — tag/release)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 scripts/release_gate.py \
            --artifacts-dir ci-artifacts \
            --target generic \
            --target modular \
            --strict \
            --ci-sha "$GITHUB_SHA" \
            --public-key /tmp/firmware_signing_public.pem \
            --pwa-path pwa-checkout \
            --firmware-repo-path .

  # --------------------------------------------------------------------------
  # [Audit 8 P0-C/P0-D] Immutable release publisher.
  # ONLY runs on tag push (v*) AND only if release-gate PASSED.
  # Creates a GitHub Release with all artifacts attached — this IS the
  # canonical distribution authority. PWA/GAS/device pull from this release
  # URL, never from a stale repo copy.
  #
  # Gate FAIL => this job does NOT run => NO RELEASE => NO OTA PUBLISH.
  # --------------------------------------------------------------------------
  release-publish:
    name: Publish immutable GitHub Release
    runs-on: ubuntu-latest
    needs: [release-gate]
    if: startsWith(github.ref, 'refs/tags/v') && needs.release-gate.result == 'success'
    permissions:
      contents: write   # required to create releases
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ci-artifacts

      # [Audit 8 P1-9/P1-10] Require hardware acceptance evidence.
      # The tag commit MUST include docs/hardware-acceptance/v<X.Y.Z>.md
      # with a completed checklist. Without it, the release is marked as
      # pre-release (beta) — never promoted to stable/fleet OTA.
      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${TAG}, version: ${VERSION}"

      - name: Check for hardware acceptance evidence
        id: hw_acceptance
        run: |
          HW_FILE="docs/hardware-acceptance/v${{ steps.version.outputs.version }}.md"
          if [ -f "$HW_FILE" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Hardware acceptance evidence found: $HW_FILE"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "WARNING: No hardware acceptance evidence at $HW_FILE"
            echo "Release will be marked as pre-release (beta) — NOT stable."
          fi

      - name: Stage release assets
        run: |
          mkdir -p release-assets
          # Modular production artifacts (signed)
          cp ci-artifacts/plts-firmware-modular-production/*.bin release-assets/ 2>/dev/null || true
          cp ci-artifacts/plts-firmware-modular-production/*.bin.sig release-assets/ 2>/dev/null || true
          cp ci-artifacts/plts-firmware-modular-production/*.bin.sha256 release-assets/ 2>/dev/null || true
          cp ci-artifacts/plts-firmware-modular-production/*.bin.ota.json release-assets/ 2>/dev/null || true
          cp ci-artifacts/plts-firmware-modular-production/release.json release-assets/modular-release.json 2>/dev/null || true
          cp ci-artifacts/plts-firmware-modular-production/provenance.json release-assets/modular-provenance.json 2>/dev/null || true
          cp ci-artifacts/plts-firmware-modular-production/SHA256SUMS release-assets/modular-SHA256SUMS 2>/dev/null || true
          # Generic tree artifacts
          cp ci-artifacts/plts-firmware-generic/*.bin release-assets/ 2>/dev/null || true
          cp ci-artifacts/plts-firmware-generic/release.json release-assets/generic-release.json 2>/dev/null || true
          cp ci-artifacts/plts-firmware-generic/provenance.json release-assets/generic-provenance.json 2>/dev/null || true
          cp ci-artifacts/plts-firmware-generic/SHA256SUMS release-assets/generic-SHA256SUMS 2>/dev/null || true
          cp ci-artifacts/plts-firmware-generic/manifest.json release-assets/generic-manifest.json 2>/dev/null || true
          # Hardware acceptance evidence (if exists)
          if [ -f "docs/hardware-acceptance/v${{ steps.version.outputs.version }}.md" ]; then
            cp "docs/hardware-acceptance/v${{ steps.version.outputs.version }}.md" release-assets/
          fi
          ls -la release-assets/

      - name: Generate release notes
        id: notes
        env:
          HW_EXISTS: ${{ steps.hw_acceptance.outputs.exists }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo "## PLTS Monitor Firmware $TAG"
            echo ""
            echo "### Artifacts"
            echo "- **Modular production** (signed with Ed25519): bootloader.bin, partitions.bin, firmware.bin + .sig"
            echo "- **Generic** (legacy ESP Web Tools): bootloader.bin, partitions.bin, plts_firmware_v${VERSION}.bin"
            echo "- **Provenance**: release.json, provenance.json, SHA256SUMS per target"
            echo ""
            echo "### Verification"
            echo "Each artifact has an immutable SHA-256 recorded in release.json and provenance.json."
            echo "The modular production firmware.bin is signed with Ed25519; verify with:"
            echo '```bash'
            echo "python3 scripts/sign_firmware.py --verify firmware.bin.sig firmware.bin"
            echo '```'
            echo ""
            echo "### Hardware Acceptance"
            if [ "$HW_EXISTS" = "true" ]; then
              echo "**PASSED** — see hardware-acceptance/v${VERSION}.md (attached)."
              echo ""
              echo "### Status: STABLE — safe for fleet OTA promotion."
            else
              echo "**NOT COMPLETED** — no hardware acceptance evidence file found."
              echo ""
              echo "### Status: PRE-RELEASE (beta) — NOT for fleet OTA."
              echo "Run the hardware acceptance checklist (docs/hardware-acceptance/README.md)"
              echo "on real ESP32 hardware, attach the completed file, and re-tag to promote to stable."
            fi
            echo ""
            echo "### Canonical Source"
            echo "This GitHub Release IS the canonical distribution authority."
            echo "PWA / GAS / device MUST reference this release URL — never a stale repo copy."
            echo ""
            echo "---"
            echo "Generated by CI on commit \`${GITHUB_SHA}\`."
          } > release-notes.md
          echo "Release notes generated:"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "PLTS Monitor Firmware ${{ steps.version.outputs.tag }}"
          body_path: release-notes.md
          files: release-assets/*
          # [Audit 8 P1-9/P1-10] Mark as pre-release if no hardware acceptance
          prerelease: ${{ steps.hw_acceptance.outputs.exists != 'true' }}
          draft: false
          generate_release_notes: false
