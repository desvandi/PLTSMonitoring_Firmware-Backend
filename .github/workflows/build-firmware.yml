name: build-firmware

# ============================================================================
# CI Release Engineering — Audit 9 remediation.
#
# Full release chain (no skip paths, no false-green):
#   source → build → sign → gate → tag-verify → hw-verify → release
#
# Key invariants enforced:
#   [P0-1] Tag must be signed + authorized + point to GITHUB_SHA
#   [P0-2] Hardware acceptance must be a verified JSON (verdict=PASS, all
#          checks PASS, all signoffs present, SHA matches, commit matches)
#   [P0-3] release-gate only runs when ALL needed builds succeeded
#   [P1]   Canonical manifest enforced in gate
#   [P1]   Exact artifact inventory (no `|| true` silent failures)
#   [P1]   Actions pinned by immutable SHA
#   [P1]   pip + cryptography pinned to exact versions
# ============================================================================

on:
  push:
    branches:
      - main
    paths:
      - 'firmware/**'
      - 'firmware-generic/**'
      - 'scripts/**'
      - '.github/workflows/build-firmware.yml'
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Manual build reason"
        required: false
        default: "manual"

permissions:
  contents: read

# [Audit 9 P1] Immutable SHA-pinned actions. Major-version tags (@v4) are
# mutable — a supply-chain attack on the action repo would silently change
# the action behavior. Pinning by commit SHA makes the action immutable.
# SHA values verified via GitHub API on 2026-09-04.
env:
  PIO_CORE: "6.1.18"
  CRYPTO_VERSION: "43.0.1"
  PIP_VERSION: "24.2"

jobs:
  test:
    name: Python unit + property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Setup Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c  # v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade "pip==${PIP_VERSION}"
          pip install "cryptography==${CRYPTO_VERSION}"
      - name: Run firmware logic tests
        run: |
          fail=0
          for t in scripts/test_*.py; do
            echo "=== $t ==="
            python "$t" || fail=1
          done
          exit $fail

  # --------------------------------------------------------------------------
  # Production build. Only on push-to-main or tag (not PR — production env
  # secrets are protected). On tag push, the firmware is signed with Ed25519.
  # --------------------------------------------------------------------------
  build-production:
    name: PlatformIO build — env:production (modular, signed)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: production
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c  # v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO (deterministic)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-prod-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}-v1

      - name: Install PlatformIO + cryptography (pinned)
        run: |
          python -m pip install --upgrade "pip==${PIP_VERSION}"
          pip install "platformio==${PIO_CORE}" "cryptography==${CRYPTO_VERSION}"

      - name: Compile production env (modular)
        working-directory: firmware
        env:
          MQTT_BROKER_HOST:           ${{ secrets.PIO_MQTT_BROKER_HOST }}
          MQTT_BROKER_PORT:           ${{ secrets.PIO_MQTT_BROKER_PORT }}
          MQTT_USERNAME:              ${{ secrets.PIO_MQTT_USERNAME }}
          MQTT_PASSWORD:              ${{ secrets.PIO_MQTT_PASSWORD }}
          MQTT_ROOT_CA:               ${{ secrets.PIO_MQTT_ROOT_CA }}
          OTA_ED25519_PUBLIC_KEY_HEX: ${{ secrets.PIO_OTA_ED25519_PUBLIC_KEY_HEX }}
          OTA_HTTPS_ROOT_CA:          ${{ secrets.PIO_OTA_HTTPS_ROOT_CA }}
        run: pio run -e production

      - name: Stage modular artifacts
        working-directory: firmware
        run: |
          mkdir -p artifacts
          cp .pio/build/production/bootloader.bin artifacts/bootloader.bin
          cp .pio/build/production/partitions.bin artifacts/partitions.bin
          cp .pio/build/production/firmware.bin   artifacts/firmware.bin

      - name: Generate provenance
        run: |
          FIRMWARE_VERSION=$(grep -oE 'FIRMWARE_VERSION\s*=\s*"[0-9.]+"' firmware/Core/Config.h \
                            | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          python3 scripts/generate_provenance.py \
            --target modular \
            --version "${FIRMWARE_VERSION}" \
            --bin-dir firmware/artifacts \
            --firmware-name firmware.bin \
            --out-dir firmware/artifacts

      - name: Sign production firmware (Ed25519)
        working-directory: firmware/artifacts
        env:
          PIO_FIRMWARE_SIGNING_PRIVATE_KEY: ${{ secrets.PIO_FIRMWARE_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$PIO_FIRMWARE_SIGNING_PRIVATE_KEY" ]; then
            echo "ERROR: PIO_FIRMWARE_SIGNING_PRIVATE_KEY secret not set in production environment"
            echo "Production firmware CANNOT be released unsigned (Audit 8 P0-A)"
            exit 1
          fi
          echo "$PIO_FIRMWARE_SIGNING_PRIVATE_KEY" > firmware_signing_private.pem
          chmod 600 firmware_signing_private.pem
          python3 ../../scripts/sign_firmware.py --sign firmware.bin
          shred -u firmware_signing_private.pem
          ls -la

      - name: Generate canonical OTA manifest (schema 2.0)
        run: |
          python3 scripts/generate_canonical_manifest.py \
            --release-json firmware/artifacts/release.json \
            --provenance-json firmware/artifacts/provenance.json \
            --bin-dir firmware/artifacts \
            --out firmware/artifacts/manifest-canonical.json

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: plts-firmware-modular-production
          path: |
            firmware/artifacts/bootloader.bin
            firmware/artifacts/partitions.bin
            firmware/artifacts/firmware.bin
            firmware/artifacts/firmware.bin.sig
            firmware/artifacts/firmware.bin.sha256
            firmware/artifacts/firmware.bin.ota.json
            firmware/artifacts/release.json
            firmware/artifacts/provenance.json
            firmware/artifacts/SHA256SUMS
            firmware/artifacts/manifest-canonical.json
          if-no-files-found: error

  build-staging:
    name: PlatformIO build — env:staging + development (modular)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c  # v5
        with:
          python-version: '3.11'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-staging-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}-v1
      - name: Install PlatformIO (pinned)
        run: |
          python -m pip install --upgrade "pip==${PIP_VERSION}"
          pip install "platformio==${PIO_CORE}"
      - name: Compile development env
        working-directory: firmware
        run: pio run -e development
      - name: Compile staging env
        working-directory: firmware
        run: pio run -e staging
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: plts-firmware-modular-dev-staging
          path: |
            firmware/.pio/build/development/firmware.bin
            firmware/.pio/build/staging/firmware.bin
          if-no-files-found: error

  build-generic-tree:
    name: PlatformIO build — firmware-generic/ (legacy)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c  # v5
        with:
          python-version: '3.11'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-generic-${{ runner.os }}-${{ hashFiles('firmware-generic/platformio.ini') }}-v1
      - name: Install PlatformIO (pinned)
        run: |
          python -m pip install --upgrade "pip==${PIP_VERSION}"
          pip install "platformio==${PIO_CORE}"
      - name: Compile firmware-generic
        working-directory: firmware-generic
        run: pio run -e esp32dev
      - name: Stage binaries + manifest
        working-directory: firmware-generic
        run: |
          mkdir -p bin
          cp .pio/build/esp32dev/bootloader.bin bin/bootloader.bin
          cp .pio/build/esp32dev/partitions.bin bin/partitions.bin
          cp .pio/build/esp32dev/firmware.bin   "bin/plts_firmware_v$(python -c "import json;print(json.load(open('manifest.json'))['version'])").bin"
      - name: Generate provenance + canonical manifest
        run: |
          VERSION=$(python -c "import json;print(json.load(open('firmware-generic/manifest.json'))['version'])")
          python3 scripts/generate_provenance.py \
            --target generic --version "${VERSION}" \
            --bin-dir firmware-generic/bin --out-dir firmware-generic/bin
          python3 scripts/generate_canonical_manifest.py \
            --release-json firmware-generic/bin/release.json \
            --provenance-json firmware-generic/bin/provenance.json \
            --bin-dir firmware-generic/bin \
            --out firmware-generic/bin/manifest-canonical.json
      - name: Stage generic artifacts (flat structure for gate)
        working-directory: firmware-generic
        run: |
          mkdir -p staged
          cp bin/bootloader.bin staged/
          cp bin/partitions.bin staged/
          cp bin/plts_firmware_v*.bin staged/
          cp bin/release.json staged/
          cp bin/provenance.json staged/
          cp bin/SHA256SUMS staged/
          cp bin/manifest-canonical.json staged/
          cp manifest.json staged/manifest-espwebtools.json
          ls -la staged/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: plts-firmware-generic
          path: firmware-generic/staged/*
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # [REL-03/REL-04, v1.9.3] Reproducible build gate.
  # Builds the SAME source TWICE from a clean tree and FAILS unless the two
  # binaries are byte-identical (same SHA-256). This closes:
  #   REL-04 — two builds from the same source must produce identical SHAs
  #   REL-03 — with reproducibility proven, the hardware-tested binary can
  #            be byte-compared against the released binary
  # The v1.9.3 firmware embeds a deterministic build date (SOURCE_DATE_EPOCH
  # resolved from the git HEAD commit by firmware/scripts/set_build_date.py)
  # instead of __DATE__/__TIME__, so nothing wall-clock-dependent remains in
  # the binary. Toolchain is pinned (espressif32@6.7.0, platformio 6.1.18).
  # Mirrors build-production's trigger policy (push/dispatch only — the
  # production environment secrets are not exposed to PRs). Runs on tag
  # pushes too (event_name == 'push'), and release-publish REQUIRES it.
  # --------------------------------------------------------------------------
  reproducible-build:
    name: Reproducible build 2x (REL-04)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: production
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Full history: set_build_date.py resolves the HEAD commit
          # timestamp; keep provenance fallbacks consistent with the gate.
          fetch-depth: 0

      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c  # v5
        with:
          python-version: '3.11'

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-repro-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini', 'firmware-generic/platformio.ini') }}-v1

      - name: Install PlatformIO (pinned)
        run: |
          python -m pip install --upgrade "pip==${PIP_VERSION}"
          pip install "platformio==${PIO_CORE}"

      # ---- Modular production: build A -----------------------------------
      - name: Build A — modular production
        working-directory: firmware
        env:
          MQTT_BROKER_HOST:           ${{ secrets.PIO_MQTT_BROKER_HOST }}
          MQTT_BROKER_PORT:           ${{ secrets.PIO_MQTT_BROKER_PORT }}
          MQTT_USERNAME:              ${{ secrets.PIO_MQTT_USERNAME }}
          MQTT_PASSWORD:              ${{ secrets.PIO_MQTT_PASSWORD }}
          MQTT_ROOT_CA:               ${{ secrets.PIO_MQTT_ROOT_CA }}
          OTA_ED25519_PUBLIC_KEY_HEX: ${{ secrets.PIO_OTA_ED25519_PUBLIC_KEY_HEX }}
          OTA_HTTPS_ROOT_CA:          ${{ secrets.PIO_OTA_HTTPS_ROOT_CA }}
        run: |
          pio run -e production
          sha256sum .pio/build/production/firmware.bin > /tmp/modular-sha-a.txt
          cat /tmp/modular-sha-a.txt

      # ---- Modular production: build B (clean rebuild) -------------------
      - name: Build B — modular production (clean rebuild)
        working-directory: firmware
        env:
          MQTT_BROKER_HOST:           ${{ secrets.PIO_MQTT_BROKER_HOST }}
          MQTT_BROKER_PORT:           ${{ secrets.PIO_MQTT_BROKER_PORT }}
          MQTT_USERNAME:              ${{ secrets.PIO_MQTT_USERNAME }}
          MQTT_PASSWORD:              ${{ secrets.PIO_MQTT_PASSWORD }}
          MQTT_ROOT_CA:               ${{ secrets.PIO_MQTT_ROOT_CA }}
          OTA_ED25519_PUBLIC_KEY_HEX: ${{ secrets.PIO_OTA_ED25519_PUBLIC_KEY_HEX }}
          OTA_HTTPS_ROOT_CA:          ${{ secrets.PIO_OTA_HTTPS_ROOT_CA }}
        run: |
          rm -rf .pio/build/production .pio/generated
          pio run -e production
          sha256sum .pio/build/production/firmware.bin > /tmp/modular-sha-b.txt
          cat /tmp/modular-sha-b.txt

      - name: Compare A vs B — modular production (REL-04)
        working-directory: firmware
        run: |
          SHA_A=$(awk '{print $1}' /tmp/modular-sha-a.txt)
          SHA_B=$(awk '{print $1}' /tmp/modular-sha-b.txt)
          echo "modular production SHA-A: ${SHA_A}"
          echo "modular production SHA-B: ${SHA_B}"
          if [ "${SHA_A}" != "${SHA_B}" ]; then
            echo "FAIL: REL-04 — modular production build is NOT reproducible"
            echo "Two clean builds from commit $GITHUB_SHA produced different SHA-256s."
            echo "Check for wall-clock/random/path-dependent embeds (grep __DATE__ __TIME__)."
            exit 1
          fi
          echo "PASS: REL-04 — modular production builds are byte-identical"

      # ---- Generic tree (also a released artifact): build A --------------
      - name: Build A — firmware-generic
        working-directory: firmware-generic
        run: |
          pio run -e esp32dev
          sha256sum .pio/build/esp32dev/firmware.bin > /tmp/generic-sha-a.txt
          cat /tmp/generic-sha-a.txt

      # ---- Generic tree: build B (clean rebuild) -------------------------
      - name: Build B — firmware-generic (clean rebuild)
        working-directory: firmware-generic
        run: |
          rm -rf .pio/build/esp32dev
          pio run -e esp32dev
          sha256sum .pio/build/esp32dev/firmware.bin > /tmp/generic-sha-b.txt
          cat /tmp/generic-sha-b.txt

      - name: Compare A vs B — firmware-generic (REL-04)
        run: |
          SHA_A=$(awk '{print $1}' /tmp/generic-sha-a.txt)
          SHA_B=$(awk '{print $1}' /tmp/generic-sha-b.txt)
          echo "generic SHA-A: ${SHA_A}"
          echo "generic SHA-B: ${SHA_B}"
          if [ "${SHA_A}" != "${SHA_B}" ]; then
            echo "FAIL: REL-04 — firmware-generic build is NOT reproducible"
            exit 1
          fi
          echo "PASS: REL-04 — firmware-generic builds are byte-identical"

  # --------------------------------------------------------------------------
  # Master release gate.
  # [Audit 9 P0-3 + self-review fix] Must include build-production in needs
  # so download-artifact can fetch the modular-production artifact.
  # On PR, build-production is skipped (if: push/dispatch only) — the gate
  # tolerates this via the result check.
  # --------------------------------------------------------------------------
  release-gate:
    name: Master release gate
    runs-on: ubuntu-latest
    needs: [build-production, build-staging, build-generic-tree]
    if: |
      always() &&
      needs.build-staging.result == 'success' &&
      needs.build-generic-tree.result == 'success' &&
      (needs.build-production.result == 'success' ||
       (needs.build-production.result == 'skipped' && github.event_name == 'pull_request'))
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c  # v5
        with:
          python-version: '3.11'

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade "pip==${PIP_VERSION}"
          pip install "cryptography==${CRYPTO_VERSION}"

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: ci-artifacts

      # [self-review fix] On PR, build-production is skipped so there's no
      # modular-production artifact. The gate should only check the modular
      # target when the production artifact exists. We pass a flag to the
      # gate script to skip modular on PR.
      - name: Run release gate (relaxed — PR, no production artifacts)
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/release_gate.py \
            --artifacts-dir ci-artifacts \
            --target generic \
            --ci-sha "$GITHUB_SHA"

      - name: Run release gate (branch push — production if available)
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')
        run: |
          # On branch push to main, build-production runs. Check both targets.
          if [ -d ci-artifacts/plts-firmware-modular-production ]; then
            python3 scripts/release_gate.py \
              --artifacts-dir ci-artifacts \
              --target generic \
              --target modular \
              --ci-sha "$GITHUB_SHA"
          else
            python3 scripts/release_gate.py \
              --artifacts-dir ci-artifacts \
              --target generic \
              --ci-sha "$GITHUB_SHA"
          fi

      - name: Checkout PWA repo (for cross-repo check on tag releases)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          repository: desvandi/PLTSMonitoring_PWA
          path: pwa-checkout
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}

      - name: Export Ed25519 public key (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PIO_OTA_ED25519_PUBLIC_KEY_HEX: ${{ secrets.PIO_OTA_ED25519_PUBLIC_KEY_HEX }}
        run: |
          if [ -z "$PIO_OTA_ED25519_PUBLIC_KEY_HEX" ]; then
            echo "ERROR: PIO_OTA_ED25519_PUBLIC_KEY_HEX not available for tag build"
            exit 1
          fi
          python3 -c "
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey
          from cryptography.hazmat.primitives import serialization
          pub = Ed25519PublicKey.from_public_bytes(bytes.fromhex('$PIO_OTA_ED25519_PUBLIC_KEY_HEX'))
          open('/tmp/firmware_signing_public.pem', 'wb').write(pub.public_bytes(
              encoding=serialization.Encoding.PEM,
              format=serialization.PublicFormat.SubjectPublicKeyInfo,
          ))
          "

      - name: Run release gate (STRICT — tag/release)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 scripts/release_gate.py \
            --artifacts-dir ci-artifacts \
            --target generic \
            --target modular \
            --strict \
            --ci-sha "$GITHUB_SHA" \
            --public-key /tmp/firmware_signing_public.pem \
            --pwa-path pwa-checkout \
            --firmware-repo-path .

  # --------------------------------------------------------------------------
  # [Audit 9 P0-1] Tag signature verification.
  # Verifies: tag is annotated+signed, signer is authorized, tag commit ==
  # GITHUB_SHA, tag name matches release.json version.
  # BLOCKS release-publish if ANY check fails.
  # --------------------------------------------------------------------------
  verify-tag-signature:
    name: Verify signed tag (P0-1)
    runs-on: ubuntu-latest
    needs: [release-gate]
    if: startsWith(github.ref, 'refs/tags/v') && needs.release-gate.result == 'success'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c  # v5
        with:
          python-version: '3.11'

      - name: Download modular production artifact (for release.json)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: plts-firmware-modular-production
          path: ci-artifacts/modular

      - name: Import GPG public key for tag verification
        env:
          PLTS_RELEASE_GPG_PUBLIC_KEY: ${{ secrets.PLTS_RELEASE_GPG_PUBLIC_KEY }}
        run: |
          echo "$PLTS_RELEASE_GPG_PUBLIC_KEY" | gpg --import --no-tty --batch
          gpg --list-keys --keyid-format=long

      - name: Verify tag signature + identity
        env:
          AUTHORIZED_SIGNERS: ${{ secrets.AUTHORIZED_SIGNERS }}
          EXPECTED_TAGGER_EMAILS: ${{ secrets.EXPECTED_TAGGER_EMAILS }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          ARGS=(
            --tag "$TAG"
            --ci-sha "$GITHUB_SHA"
            --release-json ci-artifacts/modular/release.json
            --authorized-signers-env "$AUTHORIZED_SIGNERS"
          )
          # [Audit 2026-09-04 P0-1] Defense-in-depth: enforce tagger email identity
          # so a valid GPG signature from a mismatched email identity is caught
          # locally (GitHub would report verification=false/bad_email).
          if [ -n "$EXPECTED_TAGGER_EMAILS" ]; then
            ARGS+=(--expected-tagger-emails "$EXPECTED_TAGGER_EMAILS")
          fi
          python3 scripts/verify_tag_signature.py "${ARGS[@]}"

  # --------------------------------------------------------------------------
  # [Audit 9 P0-2] Hardware acceptance semantic gate.
  # Verifies: JSON exists, verdict=PASS, ALL checks PASS, ALL signoffs
  # present, gitCommit==GITHUB_SHA, firmwareSha256 matches release.json.
  # BLOCKS release-publish if ANY check fails.
  # --------------------------------------------------------------------------
  verify-hardware-acceptance:
    name: Verify hardware acceptance (P0-2)
    runs-on: ubuntu-latest
    needs: [verify-tag-signature]
    if: startsWith(github.ref, 'refs/tags/v') && needs.verify-tag-signature.result == 'success'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # [Audit 2026-09-04 P1-2] fetch-depth: 0 needed so the verifier
          # can resolve the parent commit (source commit) via git rev-parse.
          # Shallow clone (default fetch-depth=1) only has the tag commit,
          # so parent lookup returns 'unknown' and the parent-child check
          # fails even when the relationship is valid.
          fetch-depth: 0

      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c  # v5
        with:
          python-version: '3.11'

      - name: Download modular production artifact (for release.json)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: plts-firmware-modular-production
          path: ci-artifacts/modular

      - name: Verify hardware acceptance JSON
        # [Audit 2026-09-04 P1-2 FIX] Pass --source-commit explicitly so the
        # verifier compares hw-acceptance.gitCommit against the SOURCE commit
        # (release.json.gitCommit), NOT against GITHUB_SHA (the tag/release
        # commit). This avoids the chicken-and-egg problem where the hw-
        # acceptance JSON file lives in the release commit, making it
        # impossible for its gitCommit field to equal the release commit's SHA.
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION="${TAG#v}"
          python3 scripts/verify_hardware_acceptance.py \
            --version "$VERSION" \
            --source-commit "$GITHUB_SHA" \
            --release-json ci-artifacts/modular/release.json

  # --------------------------------------------------------------------------
  # [Audit 9 P0-C/D] Immutable release publisher.
  # ONLY runs after: release-gate PASS + tag-signature PASS + hardware-acceptance PASS
  # + reproducible-build PASS ([REL-04, v1.9.3] — a release may only publish
  # artifacts whose build determinism has been proven in this run).
  # Creates GitHub Release with EXACT artifact inventory (no `|| true`).
  # --------------------------------------------------------------------------
  release-publish:
    name: Publish immutable GitHub Release
    runs-on: ubuntu-latest
    needs: [verify-hardware-acceptance, reproducible-build]
    if: |
      startsWith(github.ref, 'refs/tags/v') &&
      needs.verify-hardware-acceptance.result == 'success' &&
      needs.reproducible-build.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c  # v5
        with:
          python-version: '3.11'

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: ci-artifacts

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # [Audit 9 P1] EXACT artifact inventory — no `|| true` silent failures.
      # Every expected file MUST exist; missing = BLOCK.
      - name: Stage release assets (strict — fail on missing)
        run: |
          set -e
          mkdir -p release-assets
          cd ci-artifacts

          # Modular production (signed)
          cp plts-firmware-modular-production/bootloader.bin       ../release-assets/modular-bootloader.bin
          cp plts-firmware-modular-production/partitions.bin       ../release-assets/modular-partitions.bin
          cp plts-firmware-modular-production/firmware.bin         ../release-assets/modular-firmware.bin
          cp plts-firmware-modular-production/firmware.bin.sig     ../release-assets/modular-firmware.bin.sig
          cp plts-firmware-modular-production/firmware.bin.sha256  ../release-assets/modular-firmware.bin.sha256
          cp plts-firmware-modular-production/release.json         ../release-assets/modular-release.json
          cp plts-firmware-modular-production/provenance.json      ../release-assets/modular-provenance.json
          cp plts-firmware-modular-production/SHA256SUMS           ../release-assets/modular-SHA256SUMS
          cp plts-firmware-modular-production/manifest-canonical.json ../release-assets/modular-manifest-canonical.json

          # Generic tree
          cp plts-firmware-generic/bootloader.bin                  ../release-assets/generic-bootloader.bin
          cp plts-firmware-generic/partitions.bin                  ../release-assets/generic-partitions.bin
          cp plts-firmware-generic/plts_firmware_v*.bin            ../release-assets/
          cp plts-firmware-generic/release.json                    ../release-assets/generic-release.json
          cp plts-firmware-generic/provenance.json                 ../release-assets/generic-provenance.json
          cp plts-firmware-generic/SHA256SUMS                      ../release-assets/generic-SHA256SUMS
          cp plts-firmware-generic/manifest-canonical.json         ../release-assets/generic-manifest-canonical.json
          cp plts-firmware-generic/manifest-espwebtools.json       ../release-assets/generic-manifest-espwebtools.json

          # Hardware acceptance evidence (verified by previous job)
          cd ..
          HW_FILE="docs/hardware-acceptance/v${{ steps.version.outputs.version }}.json"
          if [ -f "$HW_FILE" ]; then
            cp "$HW_FILE" release-assets/hardware-acceptance.json
          else
            echo "ERROR: hardware acceptance JSON not found (should have been verified by previous job)"
            exit 1
          fi
          HW_MD="docs/hardware-acceptance/v${{ steps.version.outputs.version }}.md"
          if [ -f "$HW_MD" ]; then
            cp "$HW_MD" release-assets/hardware-acceptance.md
          fi

          # [Audit 2026-09-04 P1-2] Provenance binding — explicit machine-verifiable
          # chain: tag → signed tag object → release commit → source commit →
          # hardware-tested binary SHA → released binary SHA → GitHub Release.
          # Generated at release time (not build time) because it binds the tag
          # object SHA + GitHub Release URL which are only known after publish.
          python3 scripts/generate_provenance_binding.py \
            --tag "$TAG" \
            --version "$VERSION" \
            --release-commit "$GITHUB_SHA" \
            --release-json ci-artifacts/plts-firmware-modular-production/release.json \
            --hw-json "$HW_FILE" \
            --output release-assets/provenance-binding.json \
            --github-release-url "https://github.com/${{ github.repository }}/releases/tag/$TAG"

          echo "=== Release assets ==="
          ls -la release-assets/
          echo "=== Asset count ==="
          ls release-assets/ | wc -l

      - name: Generate release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo "## PLTS Monitor Firmware $TAG"
            echo ""
            echo "### Release Chain (all verified)"
            echo "- ✅ Source integrity: built from commit \`$GITHUB_SHA\`"
            echo "- ✅ Production build: env:production (PlatformIO ${{ env.PIO_CORE }})"
            echo "- ✅ Ed25519 signature: firmware.bin signed + verified"
            echo "- ✅ Provenance: release.json + provenance.json + SHA256SUMS"
            echo "- ✅ Canonical manifest: manifest-canonical.json (schema 2.0)"
            echo "- ✅ Release gate: STRICT mode PASS (signature + cross-repo + provenance binding)"
            echo "- ✅ Tag signature: GPG-signed + authorized signer verified"
            echo "- ✅ Hardware acceptance: verdict=PASS, all 11 checks PASS, 3 signoffs"
            echo ""
            echo "### Artifacts"
            echo "| File | Description |"
            echo "|------|-------------|"
            echo "| \`modular-firmware.bin\` | Modular production firmware (signed) |"
            echo "| \`modular-firmware.bin.sig\` | Ed25519 signature |"
            echo "| \`modular-bootloader.bin\` / \`modular-partitions.bin\` | Modular boot images |"
            echo "| \`generic-bootloader.bin\` / \`generic-partitions.bin\` / \`plts_firmware_v${VERSION}.bin\` | Generic (ESP Web Tools) |"
            echo "| \`*-release.json\` / \`*-provenance.json\` / \`*-SHA256SUMS\` | Per-target provenance |"
            echo "| \`*-manifest-canonical.json\` | Schema 2.0 OTA manifest with SHA-256 + signature |"
            echo "| \`hardware-acceptance.json\` / \`.md\` | Physical test evidence |"
            echo ""
            echo "### Verification"
            echo '```bash'
            echo "# Verify firmware SHA-256"
            echo "sha256sum modular-firmware.bin"
            echo "# Compare to modular-release.json firmwareSha256"
            echo ""
            echo "# Verify Ed25519 signature"
            echo "python3 scripts/sign_firmware.py --verify modular-firmware.bin.sig modular-firmware.bin"
            echo '```'
            echo ""
            echo "### Status: STABLE — safe for fleet OTA promotion."
            echo ""
            echo "---"
            echo "Generated by CI on commit \`${GITHUB_SHA}\`."
          } > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "PLTS Monitor Firmware ${{ steps.version.outputs.tag }}"
          body_path: release-notes.md
          files: release-assets/*
          prerelease: false
          draft: false
          generate_release_notes: false
