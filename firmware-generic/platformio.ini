[platformio]
src_dir = src
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
; Default esp32 partition table already contains ota_0 + ota_1 (1.5MB each) —
; suitable for Signed OTA. Keep default unless a custom layout is needed.
board_build.partitions = default.csv
lib_deps =
  bblanchon/ArduinoJson@^7.1.0
build_flags =
  -std=gnu++17
