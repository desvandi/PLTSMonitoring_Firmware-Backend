[platformio]
src_dir = src
default_envs = esp32dev

; [P1-7 AUDIT 2026-09] Pinned toolchain for reproducible builds.
; Loose version ranges (e.g. `^6.5.0`) allowed the resolved version to drift
; over time — two builds from the SAME source commit could produce different
; binaries (audit-7 root cause of the 144-byte v1.7.1 drift). Every version
; is now EXACT. Bump deliberately, record in provenance.json, and re-verify
; build reproducibility before tagging.
[env:esp32dev]
platform          = espressif32@6.7.0
board             = esp32dev
framework         = arduino
monitor_speed     = 115200
board_build.filesystem = littlefs
; Default esp32 partition table: app0 (ota_0) + app1 (ota_1) each 0x140000
; = 1.25 MB, otadata 0x2000, spiffs 0x160000 — suitable for Signed OTA with
; bootloader rollback (CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y in the
; arduino-esp32 sdkconfig — verified 2026-09, wave 13). [W13-4] The previous
; comment claimed "1.5MB each" — actual default.csv is 1.25 MB per OTA slot.
; NOTE (mixed fleets): the modular tree uses partitions_ota_1mb5.csv with
; 0x170000-byte app slots — its images generally do NOT fit this table.
; Use manifest targeting (Code.gs [W13-2]) so a generic device never pulls
; a modular image.
board_build.partitions = default.csv
lib_deps =
  bblanchon/ArduinoJson@7.1.0
build_flags =
  -std=gnu++17
